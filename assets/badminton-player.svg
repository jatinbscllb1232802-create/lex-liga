<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" fill="none" aria-hidden="true">
  <!-- Original Lex Liga silhouette: jump smash -->
  <g fill="#f8fafc">
    <!-- Head -->
    <ellipse cx="188" cy="78" rx="28" ry="32"/>
    <!-- Torso -->
    <path d="M155 108c-8 22-6 48 4 72 6 14 18 28 22 44 3 12-2 28-6 40l18 8c6-18 12-36 10-52 8 10 22 18 34 22 8 3 18 2 24-4 4-4 4-12 0-16-10-8-24-10-34-18-6-20-4-42 2-62l-74 6z"/>
    <!-- Right arm raised (racket side) -->
    <path d="M210 120c18-28 42-48 70-58 8-3 16 4 14 12-6 22-22 40-38 56-8 8-18 14-28 18l-18-28z"/>
    <!-- Left arm with racket handle direction -->
    <path d="M160 130c-22 8-44 28-52 52-4 12 4 22 14 20 18-4 34-18 48-32 6-6 10-14 8-22l-18-18z"/>
    <!-- Racket head -->
    <ellipse cx="98" cy="210" rx="36" ry="48" transform="rotate(-25 98 210)" fill="none" stroke="#f8fafc" stroke-width="10"/>
    <ellipse cx="98" cy="210" rx="22" ry="32" transform="rotate(-25 98 210)" fill="none" stroke="#f8fafc" stroke-width="3" opacity="0.5"/>
    <!-- Racket strings hint -->
    <path d="M80 190l36 40M90 180l36 40M100 175l30 36" stroke="#f8fafc" stroke-width="2" opacity="0.35" transform="rotate(-25 98 210)"/>
    <!-- Racket shaft -->
    <path d="M120 235c12 18 28 32 42 40" stroke="#f8fafc" stroke-width="8" stroke-linecap="round"/>
    <!-- Legs - jumping -->
    <path d="M175 250c-4 28-2 56 6 82 4 14 2 28-4 40l20 6c8-16 12-34 10-52 8 14 22 24 36 28 6 2 14-2 14-10 0-16-12-28-22-40-4-22-6-46-4-68l-56 14z"/>
    <path d="M210 255c10 24 28 44 48 56 10 6 22 4 26-6 4-12-2-22-12-28-16-10-30-26-38-46l-24 24z"/>
    <!-- Shoes -->
    <path d="M165 372c-8 4-20 6-28 2-6-2-6-10 0-12 10-4 24-4 34 0 6 2 4 8-6 10z"/>
    <path d="M268 312c12 2 26 0 34-6 6-4 4-12-2-14-12 0-26 4-36 10-6 4-4 10 4 10z"/>
  </g>
  <!-- Shuttlecock -->
  <g transform="translate(300 70)">
    <ellipse cx="0" cy="8" rx="10" ry="12" fill="#f8fafc"/>
    <path d="M0 -4c-14-18-8-36 0-42 8 6 14 24 0 42z" fill="#f8fafc" opacity="0.95"/>
    <path d="M-6 -8c-10-12-6-28 0-32M6 -8c10-12 6-28 0-32M0 -10c0-14 2-28 0-34" stroke="#f8fafc" stroke-width="2" opacity="0.5"/>
  </g>
  <!-- Motion arcs -->
  <path d="M250 55c30-8 55-6 78 8" stroke="#4ade80" stroke-width="3" stroke-linecap="round" opacity="0.7" fill="none"/>
  <path d="M255 70c35-6 62-2 85 14" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round" opacity="0.45" fill="none"/>
  <path d="M260 85c32-4 58 2 78 18" stroke="#4ade80" stroke-width="2" stroke-linecap="round" opacity="0.3" fill="none"/>
</svg>
