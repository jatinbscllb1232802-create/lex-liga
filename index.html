<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lex Liga Futsal – Live Scores</title>
  <meta name="description" content="Live scores, fixtures and standings for Lex Liga Futsal college tournament" />
  <meta name="theme-color" content="#0b1120" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: { DEFAULT: '#22c55e', dark: '#16a34a' }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="min-h-screen">
  <!-- Header -->
  <header class="sticky top-0 z-50">
    <div class="max-w-5xl mx-auto px-4 py-3.5 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="logo-circle w-10 h-10 rounded-full flex items-center justify-center font-bold text-slate-900 text-sm">LL</div>
        <div>
          <h1 class="font-bold text-lg leading-tight tracking-tight">Lex Liga Futsal</h1>
          <p class="text-xs text-slate-400">Live Scores</p>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <button id="themeToggle" class="p-2 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-sm transition">☀️</button>
        <a href="fixtures.html" class="text-sm font-semibold text-primary hover:text-green-400 transition">Fixtures</a>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-6 space-y-8">
    <!-- Last updated -->
    <div class="flex items-center justify-between text-sm text-slate-400">
      <span id="lastUpdated">Loading...</span>
      <button id="refreshBtn" class="text-primary hover:text-green-400 text-sm font-semibold transition">Refresh now</button>
    </div>

    <!-- Live Matches -->
    <section>
      <h2 class="text-xl font-bold mb-4 flex items-center gap-2">
        Live Now
      </h2>
      <div id="liveMatches" class="space-y-4">
        <p class="text-slate-400 text-sm">Loading live matches...</p>
      </div>
    </section>

    <!-- Recent Results -->
    <section>
      <h2 class="text-xl font-bold mb-4">Recent Results</h2>
      <div id="recentResults" class="space-y-3">
        <p class="text-slate-400 text-sm">Loading...</p>
      </div>
    </section>

    <!-- Quick Standings -->
    <section>
      <h2 class="text-xl font-bold mb-4">Quick Standings</h2>
      <div id="quickStandings" class="grid md:grid-cols-2 gap-4">
        <p class="text-slate-400 text-sm">Loading standings...</p>
      </div>
    </section>

    <!-- Top Scorers -->
    <section>
      <h2 class="text-xl font-bold mb-4">Top Scorers</h2>
      <div id="topScorers" class="rounded-xl overflow-hidden bg-slate-800/80 border border-slate-700/50">
        <p class="p-4 text-slate-400 text-sm">Loading scorers...</p>
      </div>
    </section>
  </main>

  <footer class="border-t border-slate-800/80 mt-12 py-6 text-center text-sm text-slate-500">
    <div class="flex items-center justify-center gap-2 mb-1">
      <span class="w-2 h-2 rounded-full bg-primary"></span>
      Lex Liga Futsal
    </div>
    College Tournament • Free live scoring
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
